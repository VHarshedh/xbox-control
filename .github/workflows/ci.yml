name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: windows-latest
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
      PIP_NO_INPUT: "1"

    steps:
      - name: Check out repository
        # Pinned reference for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        # Pinned reference for actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy driver_check.py input_hooks.py stick_mapper.py profiles.py main.py

      - name: Run Pytest Test Suite
        run: |
          pytest

      - name: Run Driver Verification Check
        run: |
          python driver_check.py --ci
          python main.py --check --ci
